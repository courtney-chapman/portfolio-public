<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 114" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Complexity into clarity</title>
  <desc id="d">On the left, scattered gray points with tangled connections, labeled complexity. An arrow leads to the right, where points sit in an ordered, connected grid, labeled clarity.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1D5FA6"/>
    </marker>
  </defs>

  <rect width="680" height="114" fill="#FFFFFF"/>

  <g font-family="Helvetica, Arial, sans-serif">

    <!-- Complexity -->
    <g stroke="#CDD3DA" stroke-width="1" fill="none">
      <path d="M120,24 L211,68 M148,54 L237,19 M110,73 L190,31 M170,80 L221,41 M133,36 L250,62 M155,16 L177,73 M214,80 L123,57"/>
    </g>
    <g fill="#9CA3AF">
      <circle cx="120" cy="24" r="4"/>
      <circle cx="155" cy="16" r="4"/>
      <circle cx="237" cy="19" r="4"/>
      <circle cx="190" cy="31" r="4"/>
      <circle cx="133" cy="36" r="4"/>
      <circle cx="221" cy="41" r="4"/>
      <circle cx="148" cy="54" r="4"/>
      <circle cx="123" cy="57" r="4"/>
      <circle cx="250" cy="62" r="4"/>
      <circle cx="211" cy="68" r="4"/>
      <circle cx="110" cy="73" r="4"/>
      <circle cx="177" cy="73" r="4"/>
      <circle cx="170" cy="80" r="4"/>
      <circle cx="214" cy="80" r="4"/>
    </g>

    <path d="M296,48 H372" stroke="#1D5FA6" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>

    <!-- Clarity -->
    <g stroke="#1D5FA6" stroke-width="1" fill="none">
      <path d="M420,20 H558 M420,48 H558 M420,76 H558 M420,20 V76 M466,20 V76 M512,20 V76 M558,20 V76"/>
    </g>
    <g fill="#0E2841">
      <circle cx="420" cy="20" r="4"/><circle cx="466" cy="20" r="4"/><circle cx="512" cy="20" r="4"/><circle cx="558" cy="20" r="4"/>
      <circle cx="420" cy="48" r="4"/><circle cx="466" cy="48" r="4"/><circle cx="512" cy="48" r="4"/><circle cx="558" cy="48" r="4"/>
      <circle cx="420" cy="76" r="4"/><circle cx="466" cy="76" r="4"/><circle cx="512" cy="76" r="4"/>
    </g>
    <circle cx="558" cy="76" r="5.5" fill="#1D5FA6"/>

    <g font-size="12" font-weight="700" letter-spacing="0.96" text-anchor="middle">
      <text x="180" y="104" fill="#6B7280">COMPLEXITY</text>
      <text x="489" y="104" fill="#1D5FA6">CLARITY</text>
    </g>
  </g>
</svg>
