<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="100%" role="img" aria-labelledby="t d">
<title id="t">Lifecycle board</title>
<desc id="d">Illustrative board with one column per stage. Pre-solicitation: B&amp;P 1042, an opportunity with NDAs linked to a sub and a teaming partner and a teaming agreement, and B&amp;P 1057, a white paper linked to the opportunity. Solicitation: Solicitation 3318, a proposal linked to OCI review, pricing, data rights, and sub quotes, and Solicitation 3324, an ECP linked to pricing and Contract 7781. Award and execution: Contract 7781 linked to subcontracts, government property, deliverables, and key personnel, and PO 4410, a subcontract linked to the sub NDA and Contract 7781. Resolution: Contract 6602 in closeout, linked to property disposition, final deliverables, and sub closeouts. Each card shows an owner and progress.</desc>
