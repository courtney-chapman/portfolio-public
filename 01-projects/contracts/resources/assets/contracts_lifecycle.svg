<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 490" width="100%" role="img" aria-labelledby="t d">
<title id="t">Contract lifecycle as a connected system</title>
<desc id="d">Every contract ticket type across four stages. Pre-solicitation: NDA, teaming agreement, bailment, and a white paper that may become a proposal. Solicitation: proposal support, OCI review, pricing, data rights, subcontracts, approvals and submission, negotiations, then won or lost or dead; only won moves to award. Award and execution: contract setup, customer communications, subcontracts, deliverables, government property, patent workflows, key personnel, the general contract as the parent record, and engineering change proposals. Resolution: termination, default, cure notice, closeout. An ECP re-enters solicitation while the contract keeps executing, adding scope and ceiling. Five things make it work: workflow, continuity, context, automation, extensibility.</desc>
