<text x="20" y="372" font-size="12" font-weight="700" letter-spacing="0.96" fill="#1D5FA6">WHAT MAKES IT WORK</text>
<rect x="26" y="382" width="120" height="80" fill="#E7EFF8"/>
<text x="36" y="403" font-size="13" font-weight="700" fill="#0E2841">Workflow</text>
<text x="36" y="421" font-size="12" fill="#1F2A37">Routing,</text>
<text x="36" y="437" font-size="12" fill="#1F2A37">approvals,</text>
<text x="36" y="453" font-size="12" fill="#1F2A37">escalation</text>
<rect x="152" y="382" width="120" height="80" fill="#E7EFF8"/>
<text x="162" y="403" font-size="13" font-weight="700" fill="#0E2841">Continuity</text>
<text x="162" y="421" font-size="12" fill="#1F2A37">Email, chat,</text>
<text x="162" y="437" font-size="12" fill="#1F2A37">comments,</text>
<text x="162" y="453" font-size="12" fill="#1F2A37">full history</text>
<rect x="278" y="382" width="120" height="80" fill="#E7EFF8"/>
<text x="288" y="403" font-size="13" font-weight="700" fill="#0E2841">Context</text>
<text x="288" y="421" font-size="12" fill="#1F2A37">Linked records,</text>
<text x="288" y="437" font-size="12" fill="#1F2A37">documents,</text>
<text x="288" y="453" font-size="12" fill="#1F2A37">metadata</text>
<rect x="404" y="382" width="120" height="80" fill="#E7EFF8"/>
<text x="414" y="403" font-size="13" font-weight="700" fill="#0E2841">Automation</text>
<text x="414" y="421" font-size="12" fill="#1F2A37">Triggers,</text>
<text x="414" y="437" font-size="12" fill="#1F2A37">reminders,</text>
<text x="414" y="453" font-size="12" fill="#1F2A37">lifecycle updates</text>
<rect x="530" y="382" width="120" height="80" fill="#E7EFF8"/>
