<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" role="img" aria-labelledby="t d">
  <title id="t">What connected work makes possible</title>
  <desc id="d">Work comes in as an action needed at any stage, along with communications, approvals, and notes and reasoning. It becomes connected work: governed workflows, an owner at every step, and every link kept. That makes four things possible. Intelligence: AI follows the links. Telemetry: clean exports for dashboards. Continuity: updates feed chat, and others build their own automations. Adaptive feedback: reminders that learn. Built from request types, issue types, forms, workflows, and automations.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1D5FA6"/>
    </marker>
  </defs>

  <rect width="680" height="300" fill="#FFFFFF"/>

  <g font-family="Helvetica, Arial, sans-serif">
    <g font-size="12" font-weight="700" letter-spacing="0.96">
      <text x="28" y="24" fill="#4B5563">COMES IN</text>
      <text x="236" y="24" fill="#1D5FA6">CONNECTED WORK</text>
      <text x="470" y="24" fill="#4B5563">MAKES POSSIBLE</text>
    </g>

    <!-- Comes in -->
    <rect x="28" y="44" width="142" height="40" fill="#E7EFF8"/>
    <rect x="28" y="44" width="4" height="40" fill="#1D5FA6"/>
    <text x="42" y="61" font-size="13" font-weight="700" fill="#0E2841">Action needed</text>
    <text x="42" y="77" font-size="12" fill="#4B5563">At any stage</text>
    <g fill="#FFFFFF" stroke="#CDD3DA">
      <rect x="28.5" y="96.5" width="141" height="25"/>
      <rect x="28.5" y="128.5" width="141" height="25"/>
      <rect x="28.5" y="160.5" width="141" height="25"/>
    </g>
    <g font-size="12" fill="#1F2A37">
      <text x="40" y="113">Communications</text>
      <text x="40" y="145">Approvals</text>
      <text x="40" y="177">Notes and reasoning</text>
    </g>
    <g stroke="#1D5FA6" stroke-width="1.5" fill="none" marker-end="url(#ab)">
      <path d="M170,64 L233,84"/>
      <path d="M170,109 L233,108"/>
      <path d="M170,141 L233,132"/>
      <path d="M170,173 L233,156"/>
    </g>

    <!-- Connected work -->
    <rect x="236" y="64" width="176" height="112" fill="#0E2841"/>
    <text x="250" y="94" font-size="15" font-weight="700" fill="#FFFFFF">Connected work</text>
    <g font-size="12" fill="#D2E1F2">
      <text x="250" y="120">Governed workflows</text>
      <text x="250" y="138">An owner at every step</text>
      <text x="250" y="156">Every link kept</text>
    </g>

    <!-- Fan out -->
    <g stroke="#1D5FA6" stroke-width="1.5" fill="none" marker-end="url(#ab)">
      <path d="M412,110 L467,66"/>
      <path d="M412,116 L467,112"/>
      <path d="M412,124 L467,158"/>
      <path d="M412,130 L467,204"/>
    </g>

    <!-- Makes possible -->
    <g fill="#E7EFF8">
      <rect x="470" y="44" width="190" height="42"/>
      <rect x="470" y="91" width="190" height="42"/>
      <rect x="470" y="138" width="190" height="42"/>
      <rect x="470" y="185" width="190" height="42"/>
    </g>
    <g font-size="13" font-weight="700" fill="#0E2841">
      <text x="482" y="62">Intelligence</text>
      <text x="482" y="109">Telemetry</text>
      <text x="482" y="156">Continuity</text>
      <text x="482" y="203">Adaptive feedback</text>
    </g>
    <g font-size="12" fill="#4B5563">
      <text x="482" y="78">AI follows the links</text>
      <text x="482" y="125">Clean exports for dashboards</text>
      <text x="482" y="172">Feeds the tools people use</text>
      <text x="482" y="219">Reminders that learn</text>
    </g>

    <!-- What I built -->
    <rect x="28" y="248" width="632" height="32" fill="#F4F6F9"/>
    <text x="42" y="268" font-size="12" font-weight="700" letter-spacing="0.96" fill="#1D5FA6">WHAT I BUILT</text>
    <text x="158" y="268" font-size="12" fill="#1F2A37">Request types · Issue types · Forms · Workflows · Automations</text>
  </g>
</svg>
