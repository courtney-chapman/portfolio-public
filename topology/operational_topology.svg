<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 368" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Operational topology: one hardening loop for any domain</title>
  <desc id="d">Work in any domain, professional or personal, such as contracts, procurement, government property, manufacturing, finance and business development, enters as a need, request, compliance obligation, or execution gap. It moves through a six-step loop: governed workflow, accountability transition, lifecycle accountability, telemetry and evidence, training and continuity, and adaptive feedback. Adaptive feedback closes the hardening loop back to where work enters. Intelligence (AI guidance, drafting, escalation, policy-first logic) and visibility (status and risk, dashboards, audit readiness, operational sensing) span every step. Operational failures become system updates.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1D5FA6"/>
    </marker>
    <marker id="abl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1D5FA6"/>
    </marker>
  </defs>

  <rect width="680" height="368" fill="#FFFFFF"/>

  <g font-family="Helvetica, Arial, sans-serif">

    <!-- Any domain -->
    <text x="20" y="24" font-size="12" font-weight="700" letter-spacing="0.96" fill="#1D5FA6">ANY DOMAIN, PROFESSIONAL OR PERSONAL</text>
    <text x="20" y="44" font-size="12" fill="#1F2A37">Contracts · Procurement · Government property · Manufacturing · Finance · Business development</text>

    <!-- Entry -->
    <rect x="176" y="72" width="328" height="30" fill="#F1F3F5"/>
    <text x="340" y="91" font-size="12" fill="#1F2A37" text-anchor="middle"><tspan font-weight="700" fill="#0E2841">Work enters as</tspan> a need, request, obligation, or gap</text>
    <path d="M230,102 V121" stroke="#1D5FA6" stroke-width="1.5" fill="none" marker-end="url(#ab)"/>

    <!-- Cross-cutting frames -->
    <rect x="16" y="114" width="120" height="184" fill="#F4F6F9"/>
    <rect x="544" y="114" width="120" height="184" fill="#F4F6F9"/>
    <g font-size="12" font-weight="700" letter-spacing="0.96" fill="#1D5FA6">
      <text x="26" y="134">INTELLIGENCE</text>
      <text x="554" y="134">VISIBILITY</text>
    </g>
    <g stroke="#CDD3DA" stroke-width="1">
      <path d="M26,142.5 H126 M554,142.5 H654"/>
    </g>
    <g font-size="12" fill="#1F2A37">
      <text x="26" y="162">AI guidance</text>
      <text x="26" y="182">Drafting</text>
      <text x="26" y="202">Escalation</text>
      <text x="26" y="222">Policy-first logic</text>
      <text x="554" y="162">Status and risk</text>
      <text x="554" y="182">Dashboards</text>
      <text x="554" y="202">Audit readiness</text>
      <text x="554" y="222">Operational</text>
      <text x="554" y="238">sensing</text>
    </g>
    <g font-size="12" font-style="italic" fill="#4B5563">
      <text x="26" y="286">Every step</text>
      <text x="554" y="286">Every step</text>
    </g>

    <!-- Loop connections -->
    <g stroke="#1D5FA6" stroke-width="1.5" fill="none" marker-end="url(#ab)">
      <path d="M241,134 H327"/>
      <path d="M351,134 H437"/>
      <path d="M461,134 H500 V274 H463"/>
      <path d="M439,274 H353"/>
      <path d="M329,274 H245"/>
    </g>
    <!-- Hardening loop -->
    <path d="M217,274 H190 V105" stroke="#1D5FA6" stroke-width="2.5" stroke-dasharray="5 4" fill="none" marker-end="url(#abl)"/>
    <text x="340" y="210" font-size="12" font-weight="700" letter-spacing="0.96" fill="#1D5FA6" text-anchor="middle">HARDENING LOOP</text>

    <!-- Nodes: 1 over 6, 2 over 5, 3 over 4 -->
    <g fill="#0E2841">
      <circle cx="230" cy="134" r="11"/>
      <circle cx="340" cy="134" r="11"/>
      <circle cx="450" cy="134" r="11"/>
      <circle cx="450" cy="274" r="11"/>
      <circle cx="340" cy="274" r="11"/>
    </g>
    <circle cx="230" cy="274" r="13" fill="#1D5FA6"/>
    <g font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <text x="230" y="138">1</text>
      <text x="340" y="138">2</text>
      <text x="450" y="138">3</text>
      <text x="450" y="278">4</text>
      <text x="340" y="278">5</text>
      <text x="230" y="278">6</text>
    </g>

    <!-- Step labels -->
    <g font-size="12" fill="#0E2841" text-anchor="middle">
      <text x="230" y="162">Governed</text>
      <text x="230" y="178">workflow</text>
      <text x="340" y="162">Accountability</text>
      <text x="340" y="178">transition</text>
      <text x="450" y="162">Lifecycle</text>
      <text x="450" y="178">accountability</text>
      <text x="450" y="238">Telemetry</text>
      <text x="450" y="254">and evidence</text>
      <text x="340" y="238">Training and</text>
      <text x="340" y="254">continuity</text>
    </g>
    <g font-size="12" font-weight="700" fill="#1D5FA6" text-anchor="middle">
      <text x="230" y="238">Adaptive</text>
      <text x="230" y="254">feedback</text>
    </g>

    <!-- The claim -->
    <text x="340" y="348" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#0E2841" text-anchor="middle">Operational failures become system updates.</text>
  </g>
</svg>
