<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 376" width="100%" role="img" aria-labelledby="t d">
<title id="t">How work moves across domains</title>
<desc id="d">Work enters as a need, request, obligation, or gap and becomes a governed workflow with an owner. Five value streams hand off left to right. Opportunity to award: capture, proposal, award. Procure to pay: request, buy, receive and pay. Acquire to dispose, for government property: receive and tag, track and inventory, disposition; accountability transfers to property at receipt. Build to deliver: plan, build and test, deliver. Order to cash: acceptance, invoice, payment. Every stream feeds telemetry and evidence, with visibility, intelligence, and adaptive feedback across all of them. Accountability shifts as work crosses domains.</desc>
