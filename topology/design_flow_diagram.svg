<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318" width="100%" role="img" aria-labelledby="t d">
<title id="t">How systems are designed: eight steps from operational friction</title>
<desc id="d">Design starts with operational friction and moves through eight steps, each answering one question. State discovery: what is actually happening? Constraint discovery: what rules and boundaries apply? Workflow and ownership design: how does work move, and who owns it? Visibility and governance: where are the decision points? Validation and testing: does it hold up in real conditions? Enablement and adoption: can people run it without me? Operational telemetry: what do status and exceptions show? Adaptive feedback: what should change next? Findings return to state discovery as new signals.</desc>
<defs><marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1D5FA6"/></marker><marker id="ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6B7280"/></marker></defs>
<rect width="680" height="318" fill="#FFFFFF"/>
