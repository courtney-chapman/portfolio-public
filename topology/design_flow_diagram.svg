<text x="207" y="198" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text x="225" y="191" font-size="12" font-weight="700" fill="#0E2841">Enablement &amp;</text><text x="225" y="206" font-size="12" font-weight="700" fill="#0E2841">adoption</text>
<text x="199" y="234" font-size="12" fill="#4B5563">Can people run it</text><text x="199" y="250" font-size="12" fill="#4B5563">without me?</text>
