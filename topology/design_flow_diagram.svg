<text x="370" y="198" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
<text x="388" y="191" font-size="12" font-weight="700" fill="#0E2841">Operational</text><text x="388" y="206" font-size="12" font-weight="700" fill="#0E2841">telemetry</text>
<text x="362" y="234" font-size="12" fill="#4B5563">What do status and</text><text x="362" y="250" font-size="12" fill="#4B5563">exceptions show?</text>
<rect x="513" y="172" width="143" height="92" fill="#E7EFF8"/>
<circle cx="533" cy="194" r="11" fill="#1D5FA6"/>
<text x="533" y="198" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text>
<text x="551" y="191" font-size="12" font-weight="700" fill="#1D5FA6">Adaptive</text><text x="551" y="206" font-size="12" font-weight="700" fill="#1D5FA6">feedback</text>
<text x="525" y="234" font-size="12" fill="#4B5563">What should</text><text x="525" y="250" font-size="12" fill="#4B5563">change next?</text>
