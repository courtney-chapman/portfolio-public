<circle cx="44" cy="66" r="11" fill="#0E2841"/>
<text x="44" y="70" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="62" y="63" font-size="12" font-weight="700" fill="#0E2841">State</text><text x="62" y="78" font-size="12" font-weight="700" fill="#0E2841">discovery</text>
<text x="36" y="106" font-size="12" fill="#4B5563">What's actually</text><text x="36" y="122" font-size="12" fill="#4B5563">happening?</text>
<rect x="187" y="44" width="143" height="92" fill="#F4F6F9"/>
<circle cx="207" cy="66" r="11" fill="#0E2841"/>
<text x="207" y="70" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="225" y="63" font-size="12" font-weight="700" fill="#0E2841">Constraint</text><text x="225" y="78" font-size="12" font-weight="700" fill="#0E2841">discovery</text>
<text x="199" y="106" font-size="12" fill="#4B5563">What rules and</text><text x="199" y="122" font-size="12" fill="#4B5563">boundaries apply?</text>
<rect x="350" y="44" width="143" height="92" fill="#F4F6F9"/>
<circle cx="370" cy="66" r="11" fill="#0E2841"/>
<text x="370" y="70" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="388" y="63" font-size="12" font-weight="700" fill="#0E2841">Workflow &amp;</text><text x="388" y="78" font-size="12" font-weight="700" fill="#0E2841">ownership</text>
<text x="362" y="106" font-size="12" fill="#4B5563">How does work move,</text><text x="362" y="122" font-size="12" fill="#4B5563">and who owns it?</text>
<rect x="513" y="44" width="143" height="92" fill="#F4F6F9"/>
<circle cx="533" cy="66" r="11" fill="#0E2841"/>
<text x="533" y="70" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="551" y="63" font-size="12" font-weight="700" fill="#0E2841">Visibility &amp;</text><text x="551" y="78" font-size="12" font-weight="700" fill="#0E2841">governance</text>
<text x="525" y="106" font-size="12" fill="#4B5563">Where are the</text><text x="525" y="122" font-size="12" fill="#4B5563">decision points?</text>
<rect x="24" y="172" width="143" height="92" fill="#F4F6F9"/>
<circle cx="44" cy="194" r="11" fill="#0E2841"/>
<text x="44" y="198" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="62" y="191" font-size="12" font-weight="700" fill="#0E2841">Validation &amp;</text><text x="62" y="206" font-size="12" font-weight="700" fill="#0E2841">testing</text>
<text x="36" y="234" font-size="12" fill="#4B5563">Does it hold up in</text><text x="36" y="250" font-size="12" fill="#4B5563">real conditions?</text>
<rect x="187" y="172" width="143" height="92" fill="#F4F6F9"/>
