<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Market research workflow: from a request to a research plan and a sample output</title>
  <desc id="d">Illustrative example. A request for about 75 rugged laptops in 60 days leads to a research plan: clarify the requirement, map public sources, and flag compliance, with a rule to hand back to the contracting officer when data can't be verified. The sample output, marked draft for human review, shows a vendor landscape table where one vendor's award history is marked not found, a gap that is shown rather than filled in.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1D5FA6"/>
    </marker>
  </defs>

  <rect width="680" height="300" fill="#FFFFFF"/>

  <g font-family="Helvetica, Arial, sans-serif">

    <!-- The request -->
    <text x="20" y="24" font-size="12" font-weight="700" letter-spacing="0.96" fill="#1D5FA6">THE REQUEST</text>
    <rect x="20" y="36" width="176" height="114" fill="#F1F3F5"/>
    <g font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#0E2841">
      <text x="34" y="64">“We need about 75</text>
      <text x="34" y="86">rugged laptops in</text>
      <text x="34" y="108">60 days. What does</text>
      <text x="34" y="130">the market offer?”</text>
    </g>
    <text x="20" y="172" font-size="12" font-style="italic" fill="#4B5563">Illustrative example</text>

    <text x="20" y="206" font-size="12" font-weight="700" letter-spacing="0.96" fill="#1D5FA6">WHAT I BUILD</text>
    <g font-size="12" fill="#1F2A37">
      <text x="20" y="226">Research that surfaces</text>
      <text x="20" y="242">gaps instead of</text>
      <text x="20" y="258">filling them in.</text>
    </g>

    <!-- Research plan -->
    <rect x="220.5" y="36.5" width="215" height="247" fill="#FFFFFF" stroke="#CDD3DA" stroke-width="1"/>
    <text x="234" y="58" font-size="12" font-weight="700" letter-spacing="0.96" fill="#4B5563">RESEARCH PLAN</text>
    <g font-size="12" font-weight="700" fill="#1D5FA6">
      <text x="234" y="84">1 Clarify the requirement</text>
      <text x="234" y="126">2 Map public sources</text>
      <text x="234" y="168">3 Flag compliance</text>
    </g>
    <g font-size="12" fill="#1F2A37">
      <text x="234" y="100">Missing specs, risks, timing</text>
      <text x="234" y="142">Registrations, awards, pricing</text>
      <text x="234" y="184">Size status, trade rules</text>
    </g>
    <rect x="234" y="204" width="188" height="66" fill="#F1F3F5"/>
    <g font-size="12" fill="#1F2A37">
      <text x="246" y="224"><tspan font-weight="700">Hand back</tspan> to the contracting</text>
      <text x="246" y="240">officer when data can't</text>
      <text x="246" y="256">be verified.</text>
    </g>

    <!-- Sample output -->
    <rect x="509.5" y="10.5" width="150" height="20" fill="#FFFFFF" stroke="#1D5FA6" stroke-width="1"/>
    <text x="584.5" y="25" font-size="12" font-weight="700" fill="#1D5FA6" text-anchor="middle">Draft for human review</text>

    <rect x="460.5" y="36.5" width="199" height="247" fill="#FFFFFF" stroke="#CDD3DA" stroke-width="1"/>
    <text x="474" y="58" font-size="12" font-weight="700" letter-spacing="0.96" fill="#4B5563">SAMPLE OUTPUT</text>
    <text x="474" y="84" font-size="13" font-weight="700" fill="#0E2841">Vendor landscape</text>
    <g font-size="12" font-weight="700" fill="#4B5563">
      <text x="474" y="106">Vendor</text>
      <text x="540" y="106">Size</text>
      <text x="646" y="106" text-anchor="end">History</text>
    </g>
    <g stroke="#CDD3DA" stroke-width="1">
      <path d="M474,114.5 H646 M474,136.5 H646 M474,158.5 H646 M474,180.5 H646"/>
    </g>
    <g font-size="12" fill="#1F2A37">
      <text x="474" y="130">Vendor A</text>
      <text x="540" y="130">Small</text>
      <text x="646" y="130" text-anchor="end">Yes</text>
      <text x="474" y="152">Vendor B</text>
      <text x="540" y="152">Large</text>
      <text x="646" y="152" text-anchor="end">Yes</text>
      <text x="474" y="174">Vendor C</text>
      <text x="540" y="174">Small</text>
    </g>
    <text x="646" y="174" font-size="12" font-style="italic" fill="#4B5563" text-anchor="end">Not found</text>
    <text x="474" y="206" font-size="12" font-weight="700" fill="#0E2841">Gap shown, not filled</text>
    <g font-size="12" fill="#1F2A37">
      <text x="474" y="222">Vendor C award history</text>
      <text x="474" y="238">needs verification in an</text>
      <text x="474" y="254">authoritative source.</text>
    </g>

    <g stroke="#1D5FA6" stroke-width="1.5" fill="none" marker-end="url(#ab)">
      <path d="M196,93 H218"/>
      <path d="M436,160 H458"/>
    </g>
  </g>
</svg>
