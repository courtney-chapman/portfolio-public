<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 304" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Negotiation strategy workflow: phase-gated preparation</title>
  <desc id="d">Illustrative example: a program wants 100 licenses, maybe 300 later. Two gates control preparation. If the minimum facts are not complete, gather facts: users, term, budget. If the strategy is not complete, build it: levers and walk-away terms. Once both are complete, the buyer is ready to negotiate, with optional role-play practice. Principles: facts first, practice last, federal guardrails apply, and the buyer decides.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1D5FA6"/>
    </marker>
    <marker id="ag" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect width="680" height="304" fill="#FFFFFF"/>

  <g font-family="Helvetica, Arial, sans-serif">

    <g stroke="#CDD3DA" stroke-width="1">
      <path d="M176.5,16 V288 M516.5,16 V288"/>
    </g>

    <!-- Left: the request -->
    <text x="20" y="24" font-size="12" font-weight="700" letter-spacing="0.96" fill="#1D5FA6">ILLUSTRATIVE EXAMPLE</text>
    <g font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#0E2841">
      <text x="20" y="54">“A program wants</text>
      <text x="20" y="76">100 licenses, maybe</text>
      <text x="20" y="98">300 later. How do</text>
      <text x="20" y="120">I prepare?”</text>
    </g>
    <line x1="20" y1="200.5" x2="164" y2="200.5" stroke="#CDD3DA" stroke-width="1"/>
    <text x="20" y="224" font-size="12" font-weight="700" fill="#1F2A37">What I build</text>
    <g font-size="12" fill="#1F2A37">
      <text x="20" y="244">Preparation gated</text>
      <text x="20" y="260">by facts, with clear</text>
      <text x="20" y="276">walk-away terms.</text>
    </g>

    <!-- Center: gates -->
    <g fill="#0E2841">
      <polygon points="256,23 326,58 256,93 186,58"/>
      <polygon points="256,123 326,158 256,193 186,158"/>
    </g>
    <g font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <text x="256" y="55">Minimum facts</text>
      <text x="256" y="70">complete?</text>
      <text x="256" y="155">Strategy</text>
      <text x="256" y="170">complete?</text>
    </g>

    <g fill="#F1F3F5">
      <rect x="372" y="34" width="132" height="48"/>
      <rect x="372" y="134" width="132" height="48"/>
    </g>
    <rect x="186" y="223" width="150" height="48" fill="#D2E1F2"/>
    <rect x="372.5" y="223.5" width="131" height="47" fill="#FFFFFF" stroke="#6B7280" stroke-width="1" stroke-dasharray="4 3"/>

    <g font-size="13" font-weight="700" fill="#0E2841">
      <text x="384" y="54">Gather facts</text>
      <text x="384" y="154">Build the strategy</text>
      <text x="198" y="243">Ready to negotiate</text>
      <text x="384" y="243">Role-play practice</text>
    </g>
    <g font-size="12" fill="#1F2A37">
      <text x="384" y="71">Users, term, budget</text>
      <text x="384" y="171">Levers, walk-away</text>
      <text x="198" y="260">Within federal rules</text>
    </g>
    <text x="384" y="260" font-size="12" fill="#4B5563">Optional</text>

    <g stroke="#1D5FA6" stroke-width="1.5" fill="none" marker-end="url(#ab)">
      <path d="M326,58 H370"/>
      <path d="M326,158 H370"/>
      <path d="M256,93 V121"/>
      <path d="M256,193 V221"/>
    </g>
    <path d="M336,247 H370" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#ag)"/>
    <g font-size="12" fill="#4B5563">
      <text x="338" y="50">No</text>
      <text x="338" y="150">No</text>
      <text x="264" y="112">Yes</text>
      <text x="264" y="212">Yes</text>
    </g>

    <!-- Right: principles -->
    <g font-size="12" font-weight="700" fill="#1D5FA6">
      <text x="528" y="24">Facts first.</text>
      <text x="528" y="96">Practice last.</text>
      <text x="528" y="168">Federal guardrails.</text>
      <text x="528" y="240">Buyer decides.</text>
    </g>
    <g font-size="12" fill="#1F2A37">
      <text x="528" y="40">No strategy until the</text>
      <text x="528" y="56">minimum facts are in.</text>
      <text x="528" y="112">Role-play opens only</text>
      <text x="528" y="128">after the strategy.</text>
      <text x="528" y="184">Fair pricing and</text>
      <text x="528" y="200">documentation apply.</text>
      <text x="528" y="256">AI prepares; it does</text>
      <text x="528" y="272">not negotiate.</text>
    </g>
  </g>
</svg>
