<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 388" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Governed reasoning flow for a property loss</title>
  <desc id="d">Illustrative example: one phone is missing from a box ready to ship. Three gates control the reasoning. If the facts are not verified, hold and investigate. If the evidence does not support the claim, hold and name what is missing. If escalation is needed, route to a person who decides. Otherwise, draft for review with unknowns preserved. Guardrails: no assumed disposal, no inferred approval, no hearsay as fact, no forced conclusion.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#1D5FA6"/>
    </marker>
  </defs>

  <rect width="680" height="388" fill="#FFFFFF"/>

  <g font-family="Helvetica, Arial, sans-serif">

    <g stroke="#CDD3DA" stroke-width="1">
      <path d="M176.5,16 V372 M516.5,16 V372"/>
    </g>

    <!-- Left: the situation -->
    <text x="20" y="24" font-size="12" font-weight="700" letter-spacing="0.96" fill="#1D5FA6">ILLUSTRATIVE EXAMPLE</text>
    <g font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#0E2841">
      <text x="20" y="54">“One phone is</text>
      <text x="20" y="76">missing from a box</text>
      <text x="20" y="98">ready to ship. Is</text>
      <text x="20" y="120">this a loss?”</text>
    </g>
    <line x1="20" y1="284.5" x2="164" y2="284.5" stroke="#CDD3DA" stroke-width="1"/>
    <text x="20" y="308" font-size="12" font-weight="700" fill="#1F2A37">What I build</text>
    <g font-size="12" fill="#1F2A37">
      <text x="20" y="328">Gates that block</text>
      <text x="20" y="344">unsupported claims</text>
      <text x="20" y="360">before any draft.</text>
    </g>

    <!-- Center: gates -->
    <g fill="#0E2841">
      <polygon points="256,23 326,58 256,93 186,58"/>
      <polygon points="256,123 326,158 256,193 186,158"/>
      <polygon points="256,223 326,258 256,293 186,258"/>
    </g>
    <g font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <text x="256" y="55">Facts</text>
      <text x="256" y="70">verified?</text>
      <text x="256" y="155">Evidence</text>
      <text x="256" y="170">supports it?</text>
      <text x="256" y="255">Escalation</text>
      <text x="256" y="270">needed?</text>
    </g>

    <g fill="#F1F3F5">
      <rect x="372" y="34" width="132" height="48"/>
      <rect x="372" y="134" width="132" height="48"/>
      <rect x="372" y="234" width="132" height="48"/>
    </g>
    <rect x="186" y="323" width="150" height="48" fill="#E7EFF8"/>

    <g font-size="13" font-weight="700" fill="#0E2841">
      <text x="384" y="54">Hold: investigate</text>
      <text x="384" y="154">Hold: find proof</text>
      <text x="384" y="254">Route to a person</text>
      <text x="198" y="343">Draft for review</text>
    </g>
    <g font-size="12" fill="#1F2A37">
      <text x="384" y="71">Separate the facts</text>
      <text x="384" y="171">Name what's missing</text>
      <text x="384" y="271">A person decides</text>
      <text x="198" y="360">Unknowns preserved</text>
    </g>

    <g stroke="#1D5FA6" stroke-width="1.5" fill="none" marker-end="url(#ab)">
      <path d="M326,58 H370"/>
      <path d="M326,158 H370"/>
      <path d="M326,258 H370"/>
      <path d="M256,93 V121"/>
      <path d="M256,193 V221"/>
      <path d="M256,293 V321"/>
    </g>
    <g font-size="12" fill="#4B5563">
      <text x="338" y="50">No</text>
      <text x="338" y="150">No</text>
      <text x="338" y="250">Yes</text>
      <text x="264" y="112">Yes</text>
      <text x="264" y="212">Yes</text>
      <text x="264" y="312">No</text>
    </g>

    <!-- Right: guardrails -->
    <text x="528" y="24" font-size="12" font-weight="700" letter-spacing="0.96" fill="#4B5563">GUARDRAILS</text>
    <g font-size="12" font-weight="700" fill="#1D5FA6">
      <text x="528" y="52">No assumed disposal</text>
      <text x="528" y="116">No inferred approval</text>
      <text x="528" y="180">No hearsay as fact</text>
      <text x="528" y="244">No forced conclusion</text>
    </g>
    <g font-size="12" fill="#1F2A37">
      <text x="528" y="68">Disposal needs</text>
      <text x="528" y="84">documented evidence.</text>
      <text x="528" y="132">Verbal statements are</text>
      <text x="528" y="148">not authorization.</text>
      <text x="528" y="196">Interview statements</text>
      <text x="528" y="212">stay unverified.</text>
      <text x="528" y="260">Incomplete evidence</text>
      <text x="528" y="276">stays uncertain.</text>
    </g>
    <text x="528" y="324" font-size="12" font-style="italic" fill="#4B5563">High-risk conditions</text>
    <text x="528" y="340" font-size="12" font-style="italic" fill="#4B5563">go to human review.</text>
  </g>
</svg>
